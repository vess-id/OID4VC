name: Claude from mentions

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude-from-mentions:
    # 人間が @claude と書いたときだけ動かす（Claude自身のコメントやレビューは無視）
    if: >
      github.actor != 'claude' &&
      github.actor != 'claude[bot]' &&
      (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude')) ||

        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude')) ||

        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude')) ||

        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') ||
           contains(github.event.issue.title, '@claude')))
      )

    uses: cvoxelprotocol/.github/.github/workflows/reuse-claude-from-mentions.yml@main

    # Org Secret の ANTHROPIC_API_KEY を引き継ぐ
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
